# M1v8: Fixed comparison aggregation.
# Over M1v7:
#   - comparison: fixed chain_instruction (yes/no awareness, no wrong "entity NAME" mandate)
#   - comparison: self-verify disabled (biased toward entity 0 section)
#   - bridge: reverted to flat pool (last-agent-only was slightly worse)
#   - fixed ===== separator bug in per-entity sections

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 4096
  chat_template_kwargs:
    enable_thinking: false

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_decomposer: true
  enable_doc_cache: false
  enable_self_verify: true
  max_loops_per_agent: 7
  max_token_budget: 64000
  max_concurrent: 3
  verbose: false
