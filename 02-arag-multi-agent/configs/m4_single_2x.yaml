# M4: Single-agent with 2x iterations (equal-compute control).
# Tests: architecture > compute hypothesis.
# Hypothesis: M1 > M4 (multi-agent architecture beats more iterations).

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: false

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

# Single-agent mode: disable decomposer, run one agent with more loops
multi_agent:
  enable_decomposer: false        # <-- bypass decomposer
  enable_doc_cache: false
  enable_self_verify: false
  max_loops_per_agent: 6           # <-- 2x baseline (E4 uses max_loops=3 effective)
  max_token_budget: 128000
  max_concurrent: 1
  verbose: false
