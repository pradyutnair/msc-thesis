# M6 Ablation: Single retriever instead of two.
# Tests value of parallel retrieval.

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_retrievers: 1
  retriever_max_loops: 5
  retriever_max_budget: 32000
  max_ticks: 30
  token_budget: 200000
  wall_clock_timeout: 300.0
  enable_critic: true
  enable_backtracking: true
  enable_consistency_check: true
