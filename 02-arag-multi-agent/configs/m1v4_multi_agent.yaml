# M1v4: Multi-agent, no cache, WITH THINKING MODE enabled.
# Fixes: enable_thinking=true, max_tokens=8192, max-model-len=32768
# Hypothesis: thinking mode was the primary cause of M1v3 < E4 (35.2% vs 53.7%)

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192
  chat_template_kwargs:
    enable_thinking: true

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_decomposer: true
  enable_doc_cache: false
  enable_self_verify: true
  max_loops_per_agent: 7
  max_token_budget: 128000
  max_concurrent: 3
  verbose: false
