# M6 v23: F1+F2+F3 fixes
# F1: Enable consistency check + pass expected_answer to synthesizer
# F2: Worker evidence grounding verification
# F3: Synthesis prompt rewrite (comparison, yes/no, bridge)

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_workers: 2
  worker_max_steps: 16
  max_actions: 100
  token_budget: 300000
  wall_clock_timeout: 900.0
  idle_timeout: 300.0
  enable_consistency_check: false
  max_redecompositions: 1
  enable_search_and_read: true
  enable_semantic_warmstart: false
  worker_plan_prompt: "worker_plan_v23.txt"
  synthesizer_prompt: "synthesizer_v23.txt"
