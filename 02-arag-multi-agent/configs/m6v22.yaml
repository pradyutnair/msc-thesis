# M6 v22: search_and_read tool + improved worker prompt + enhanced warm-start
# Changes from v21b:
#   - search_and_read tool registered (was missing)
#   - New worker prompt: uses search_and_read, no mandatory double-check
#   - Enhanced warm-start: semantic + keyword on full question
#   - Better fallback answer extraction (LLM-based)

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_workers: 2
  worker_max_steps: 16
  max_actions: 100
  token_budget: 300000
  wall_clock_timeout: 900.0
  idle_timeout: 300.0
  enable_consistency_check: false
  max_redecompositions: 1
  enable_search_and_read: true
  enable_semantic_warmstart: true