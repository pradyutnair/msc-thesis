# M6 v30: Context-anchored retrieval for bridge hops
#
# Changes from v29:
#   - decomposer_v30: bridge sub-questions get "context bypass queries"
#     that use original question entities instead of [answer_N] placeholders
#   - Workers search from multiple angles: resolved queries + bypass queries
#   - If upstream answer is wrong, bypass queries can still find the right chunk
#   - Zero extra LLM calls — just better query generation at decomposition time

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_workers: 2
  worker_max_steps: 16
  max_actions: 100
  token_budget: 300000
  wall_clock_timeout: 900.0
  idle_timeout: 300.0
  enable_consistency_check: false
  max_redecompositions: 1
  enable_search_and_read: true
  enable_semantic_warmstart: true
  decomposer_prompt: "decomposer_v30.txt"
  worker_plan_prompt: "worker_plan_v29.txt"
  synthesizer_prompt: "synthesizer_v29.txt"
