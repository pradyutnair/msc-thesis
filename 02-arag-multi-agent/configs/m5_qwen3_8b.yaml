# M5: Multi-agent wrapper around E2 subagents (Qwen3-8B dense).
# Orchestrator (thinking ON) decomposes; E2 subagents (thinking OFF) retrieve.

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

agent:
  max_loops: 10
  max_token_budget: 128000

subagent:
  max_loops: 5
  max_token_budget: 32000
  max_tokens: 4096
