# M6v17: v13l base + dedicated SynthesizerAgent
# PlannerAgent: decompose → monitor (no synthesis)
# WorkerAgents: plan → execute (v13l prompt, no verify)
# SynthesizerAgent: dedicated synthesis with reasoning

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_workers: 2
  worker_max_steps: 12
  max_actions: 100
  token_budget: 300000
  wall_clock_timeout: 900.0
  idle_timeout: 300.0
  enable_consistency_check: false
  max_redecompositions: 1
