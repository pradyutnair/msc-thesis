# M6: Blackboard-coordinated multi-agent RAG (Qwen3-8B dense).
# 5 agents: Decomposer, Retriever×2, Critic, Synthesizer.
# Tick-based coordination with per-hop verification and backtracking.

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_retrievers: 2
  retriever_max_loops: 10
  retriever_max_budget: 80000
  max_ticks: 20
  token_budget: 300000
  wall_clock_timeout: 900.0
  enable_critic: false
  enable_backtracking: false
  enable_consistency_check: false
  max_redecompositions: 1
