# M6 v25: Pre-retrieval + better prompts + improved answer normalization
# Key changes from v23:
#   - NO warm-start (disabled) — replaced by per-SQ pre-retrieval in worker
#   - worker_plan_v25.txt: workers auto-execute planner search queries before LLM loop
#   - synthesizer_v25.txt: stronger comparison/yes-no/bridge logic
#   - answer_utils.py: XML tag stripping, reasoning prefix removal, better yes/no

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_workers: 2
  worker_max_steps: 16
  max_actions: 100
  token_budget: 300000
  wall_clock_timeout: 900.0
  idle_timeout: 300.0
  enable_consistency_check: false
  max_redecompositions: 1
  enable_search_and_read: true
  enable_semantic_warmstart: false
  worker_plan_prompt: "worker_plan_v25.txt"
  synthesizer_prompt: "synthesizer_v25.txt"
