# M6 v31: Evidence-Guided Exploration
#
# Core innovation: workers mine retrieved evidence for entity leads
# and share them across bridge hops via the blackboard.
# When worker N finds chunks for hop N, it extracts distinctive terms
# and posts them as evidence_leads. Worker N+1 gets these as extra
# search queries, enabling it to find chunks that keyword search alone misses.
#
# All thinking OFF. Training-free.

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_workers: 2
  worker_max_steps: 12
  max_actions: 80
  token_budget: 300000
  wall_clock_timeout: 900.0
  idle_timeout: 300.0
  enable_consistency_check: false
  max_redecompositions: 1
  enable_search_and_read: true
  enable_semantic_warmstart: true
  decomposer_prompt: "decomposer_v29.txt"
  worker_plan_prompt: "worker_plan_v31.txt"
  synthesizer_prompt: "synthesizer_v29.txt"
