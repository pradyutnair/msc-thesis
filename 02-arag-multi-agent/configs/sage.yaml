# SAGE: Multi-Agent A-RAG with Dedicated Agents
#
# Architecture: Planner -> Retriever(s) -> Verifier -> [loop] -> Synthesizer
#
# Key innovations:
# 1. search_and_read tool: eliminates reads=0 failure mode
# 2. Planner: focused retrieval plan with specific queries
# 3. Verifier: evidence sufficiency check + gap detection + noise filtering
# 4. Synthesizer: clean synthesis from verified evidence only
#
# Token efficiency: Each agent starts fresh with only its needed input.
# No context accumulation across the ReAct loop.

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_sage: true

  # Planner settings
  sage_planner_prompt: "src/multi_agent/prompts/sage_planner.txt"

  # Retriever settings (A-RAG agent with search_and_read)
  sage_retriever_prompt: "src/multi_agent/prompts/sage_retriever.txt"
  sage_retriever_max_loops: 5
  sage_max_concurrent: 3

  # Verifier settings
  sage_verifier_prompt: "src/multi_agent/prompts/sage_verifier.txt"
  sage_max_verification_rounds: 2

  # Synthesizer settings
  sage_synth_prompt: "src/multi_agent/prompts/sage_synth.txt"

  # Shared settings
  max_token_budget: 64000
  verbose: false
