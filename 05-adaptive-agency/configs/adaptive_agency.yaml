llm:
  model: Qwen2.5-7B-Instruct
  api_key: dummy
  base_url: http://127.0.0.1:8000/v1
  temperature: 0.0
  max_tokens: 8192
embedding:
  model: intfloat/e5-base-v2
  device: cpu
data:
  # FlashRAG 21M Wikipedia corpus (existing download)
  sqlite_db: /projects/prjs1800/datasets/flashrag/wiki18_100w.db
  faiss_index: /projects/prjs1800/datasets/flashrag/indexes/e5_Flat.index
adaptive:
  worker_max_steps: 16
  max_actions: 100
  token_budget: 300000
  wall_clock_timeout: 900.0
  idle_timeout: 300.0
  enable_consistency_check: false
  max_redecompositions: 1
  structured:
    max_queries_per_entity: 6
    retrieval_top_k: 5
    retry_low_confidence: true
    confidence_threshold: 0.6
