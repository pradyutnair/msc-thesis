# SAGE Autonomous config for 2WikiMultiHop

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  temperature: 0.0
  max_tokens: 4096
  chat_template_kwargs:
    enable_thinking: true

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "data/2wikimultihop/chunks.json"
  questions_file: "data/2wikimultihop/questions.json"
  index_dir: "data/2wikimultihop/index_e5_base_v2"

multi_agent:
  enable_autonomous: true

  # Strategist
  max_rounds: 4
  verification_enabled: true
  min_confidence_threshold: 0.3

  # Investigators
  max_concurrent_investigators: 3
  max_loops_per_investigator: 5
  investigator_token_budget: 16384
  retrieval_top_k: 15
  query_augmentation_enabled: true

  max_token_budget: 32768
  verbose: false
