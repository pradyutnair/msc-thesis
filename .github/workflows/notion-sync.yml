name: Sync Notion papers to Markdown

on:
  schedule:
    # Run once daily at 2:00 AM UTC
    - cron: "0 2 * * *"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "notion-client==2.7.0" pyyaml python-slugify
          python -c "import importlib.metadata as m; print('notion-client version:', m.version('notion-client'))"

      - name: Export Notion database to Markdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python scripts/notion_export.py

      - name: Commit and push changes if any
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add -A
          # Only commit if there are changes
          git diff-index --quiet HEAD || git commit -m "Auto-sync Notion papers [skip ci]"
          git push
