# Configuration for TriviaQA Baseline

dataset:
  name: "triviaqa"
  dir: "/projects/prjs1800/datasets/triviaqa"
  split: "dev"
  limit: null  # Set to a number to limit the dataset size for testing

retriever:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  top_k: 10
  batch_size: 64

output:
  dir: "/projects/prjs1800/results/naive_baseline/triviaqa"
  save_index: true
  index_dir: "/projects/prjs1800/results/naive_baseline/triviaqa/index"
