# Reranker + CoT Prompting with SHORT output — Qwen2.5-7B-Instruct + E5-base-v2 + BGE-reranker-v2-m3 on MuSiQue
# Day 5: Controls for max_tokens confound
# Same as Reranker+CoT but max_tokens=32 (same as Day 1/2) to isolate CoT prompt effect from verbosity

# ------------------------------------------------Global Paths------------------------------------------------#
model2path:
  e5: "intfloat/e5-base-v2"
  bge-reranker-v2-m3: "BAAI/bge-reranker-v2-m3"

model2pooling:
  e5: "mean"

method2index:
  e5: "/projects/prjs1800/datasets/flashrag/indexes/e5_Flat.index"

# ------------------------------------------------Environment Settings------------------------------------------------#
data_dir: "/projects/prjs1800/datasets/flashrag"
save_dir: "/projects/prjs1800/results/day5"

gpu_id: "0"
dataset_name: "musique"
split: ["test"]

test_sample_num: ~
random_sample: False
seed: 2024

save_intermediate_data: True
save_note: "reranker_cot_short_qwen25_musique"

is_reasoning: False

# ------------------------------------------------Retrieval Settings------------------------------------------------#
retrieval_method: "e5"
index_path: "/projects/prjs1800/datasets/flashrag/indexes/e5_Flat.index"
faiss_gpu: False
corpus_path: "/projects/prjs1800/datasets/flashrag/retrieval-corpus/wiki18_100w.jsonl"

instruction: ~
retrieval_topk: 20
retrieval_batch_size: 256
retrieval_use_fp16: True
retrieval_query_max_length: 128
save_retrieval_cache: False
use_retrieval_cache: False
retrieval_cache_path: ~
retrieval_pooling_method: ~

# ------------------------------------------------Reranker Settings------------------------------------------------#
use_reranker: True
rerank_model_name: "bge-reranker-v2-m3"
rerank_model_path: "BAAI/bge-reranker-v2-m3"
rerank_topk: 5
rerank_max_length: 512
rerank_batch_size: 256
rerank_use_fp16: True
rerank_pooling_method: ~

# ------------------------------------------------Generator Settings------------------------------------------------#
framework: vllm
generator_model: "Qwen/Qwen2.5-7B-Instruct"
generator_model_path: "Qwen/Qwen2.5-7B-Instruct"
generator_max_input_len: 16384
generator_batch_size: 4
gpu_memory_utilization: 0.85
vllm_tensor_parallel_size: 1
generation_params:
  do_sample: False
  max_tokens: 32
use_fid: False

# ------------------------------------------------Refiner Settings------------------------------------------------#
refiner_name: ~
refiner_model_path: ~

# ------------------------------------------------Evaluation Settings------------------------------------------------#
metrics: ["em", "f1", "precision", "recall"]
metric_setting:
  retrieval_recall_topk: 5
save_metric_score: True
