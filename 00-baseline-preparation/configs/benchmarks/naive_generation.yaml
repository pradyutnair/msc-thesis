# FlashRAG Naive Generation Configuration (no retrieval)
# Location: msc-thesis/configs/flashrag/naive_generation.yaml

# ------------------------------------------------Global Paths------------------------------------------------#
model2path:
  e5: "intfloat/e5-base-v2"
  bge: "BAAI/bge-base-en-v1.5"
  contriever: "facebook/contriever"
  llama3-8B-instruct: "meta-llama/Meta-Llama-3-8B-Instruct"
  llama3-8B: "meta-llama/Meta-Llama-3-8B"
  mistral-7b-instruct: "mistralai/Mistral-7B-Instruct-v0.2"

model2pooling:
  e5: "mean"
  bge: "cls"
  contriever: "mean"
  jina: 'mean'
  dpr: cls

method2index:
  e5: ~
  bm25: ~
  contriever: ~

# ------------------------------------------------Environment Settings------------------------------------------------#
data_dir: "/projects/prjs1800/datasets/flashrag"
save_dir: "/projects/prjs1800/results/flashrag"

gpu_id: "0"
dataset_name: "nq"
split: [ "test" ]

test_sample_num: ~
random_sample: False
seed: 2024
save_intermediate_data: True
save_note: 'naive_generation'

# -------------------------------------------------Retrieval Settings------------------------------------------------#
# Not used in naive generation, but required by config schema
retrieval_method: "e5"
index_path: ~
faiss_gpu: False
corpus_path: ~
instruction: ~
retrieval_topk: 5
retrieval_batch_size: 256
retrieval_use_fp16: True
retrieval_query_max_length: 128
save_retrieval_cache: False
use_retrieval_cache: False
retrieval_cache_path: ~
retrieval_pooling_method: ~
use_reranker: False
rerank_model_name: ~
rerank_model_path: ~
rerank_pooling_method: ~
rerank_topk: 5
rerank_max_length: 512
rerank_batch_size: 256
rerank_use_fp16: True

# -------------------------------------------------Generator Settings------------------------------------------------#
framework: vllm
generator_model: "llama3-8B-instruct"
generator_model_path: "meta-llama/Meta-Llama-3-8B-Instruct"
generator_max_input_len: 2048
generator_batch_size: 2
gpu_memory_utilization: 0.90
vllm_tensor_parallel_size: 1
generation_params:
  do_sample: False
  max_tokens: 32
use_fid: False

# -------------------------------------------------Refiner Settings------------------------------------------------#
refiner_name: ~
refiner_model_path: ~
refiner_topk: 5
refiner_pooling_method: 'mean'
refiner_encode_max_length: 256
refiner_max_input_length: 1024
refiner_max_output_length: 512

llmlingua_config:
  rate: 0.55
  condition_in_question: 'after_condition'
  reorder_context: 'sort'
  dynamic_context_compression_ratio: 0.3
  condition_compare: True
  context_budget: "+100"
  rank_method: 'longllmlingua'
sc_config:
  'reduce_ratio': 0.5

# -------------------------------------------------Evaluation Settings------------------------------------------------#
metrics: [ 'em','f1','acc','precision','recall']
metric_setting:
  retrieval_recall_topk: 5
save_metric_score: True
