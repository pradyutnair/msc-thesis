# FlashRAG Standard RAG Configuration
# Location: msc-thesis/configs/flashrag/standard_rag.yaml

# ------------------------------------------------Global Paths------------------------------------------------#
# Paths to models
model2path:
  e5: "intfloat/e5-base-v2"
  bge: "BAAI/bge-base-en-v1.5"
  contriever: "facebook/contriever"
  llama2-7B-chat: "meta-llama/Llama-2-7b-chat-hf"
  llama2-7B: "meta-llama/Llama-2-7b-hf"
  llama2-13B: "meta-llama/Llama-2-13b-hf"
  llama2-13B-chat: "meta-llama/Llama-2-13b-chat-hf"
  llama3-8B-instruct: "meta-llama/Meta-Llama-3-8B-Instruct"
  llama3-8B: "meta-llama/Meta-Llama-3-8B"
  mistral-7b-instruct: "mistralai/Mistral-7B-Instruct-v0.2"

# Pooling methods for each embedding model
model2pooling:
  e5: "mean"
  bge: "cls"
  contriever: "mean"
  jina: 'mean'
  dpr: cls

# Indexes path for retrieval models
method2index:
  e5: "/projects/prjs1800/datasets/flashrag/indexes/e5_Flat.index"
  bm25: ~
  contriever: ~

# ------------------------------------------------Environment Settings------------------------------------------------#
# Directory paths for data and outputs
data_dir: "/projects/prjs1800/datasets/flashrag"
save_dir: "/projects/prjs1800/results/flashrag"

gpu_id: "0,1"
dataset_name: "nq"
split: [ "test" ]

# Sampling configurations for testing
test_sample_num: ~
random_sample: False

# Seed for reproducibility
seed: 2024

# Whether save intermediate data
save_intermediate_data: True
save_note: 'standard_rag'

# -------------------------------------------------Retrieval Settings------------------------------------------------#
retrieval_method: "e5"
index_path: "/projects/prjs1800/datasets/flashrag/indexes/e5_Flat.index"

# FAISS GPU disabled - index is ~60GB, doesn't fit on GPU with LLM
# CPU FAISS with parallelization is still fast on H100 node (16 cores)
faiss_gpu: False

corpus_path: "/projects/prjs1800/datasets/flashrag/retrieval-corpus/wiki18_100w.jsonl"

instruction: ~
retrieval_topk: 5
retrieval_batch_size: 256
retrieval_use_fp16: True
retrieval_query_max_length: 128
save_retrieval_cache: False
use_retrieval_cache: False
retrieval_cache_path: ~
retrieval_pooling_method: ~

use_reranker: False
rerank_model_name: ~
rerank_model_path: ~
rerank_pooling_method: ~
rerank_topk: 5
rerank_max_length: 512
rerank_batch_size: 256
rerank_use_fp16: True

# -------------------------------------------------Generator Settings------------------------------------------------#
framework: vllm
generator_model: "llama3-8B-instruct"
generator_model_path: "meta-llama/Meta-Llama-3-8B-Instruct"
generator_max_input_len: 2048
generator_batch_size: 2
gpu_memory_utilization: 0.80  # Can use more GPU since FAISS is on CPU
vllm_tensor_parallel_size: 1
generation_params:
  do_sample: False
  max_tokens: 32
use_fid: False

# -------------------------------------------------Refiner Settings------------------------------------------------#
refiner_name: ~
refiner_model_path: ~

refiner_topk: 5
refiner_pooling_method: 'mean'
refiner_encode_max_length: 256
refiner_max_input_length: 1024
refiner_max_output_length: 512

llmlingua_config:
  rate: 0.55
  condition_in_question: 'after_condition'
  reorder_context: 'sort'
  dynamic_context_compression_ratio: 0.3
  condition_compare: True
  context_budget: "+100"
  rank_method: 'longllmlingua'
sc_config:
  'reduce_ratio': 0.5

# -------------------------------------------------Evaluation Settings------------------------------------------------#
metrics: [ 'em','f1','acc','precision','recall']
metric_setting:
  retrieval_recall_topk: 5
save_metric_score: True
