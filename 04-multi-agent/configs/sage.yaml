# SAGE: Multi-Agent A-RAG with Dedicated Agents
#
# Architecture: Planner -> Retriever(s) -> Verifier -> [loop] -> Synthesizer

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 4096

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_sage: true

  # Planner settings
  sage_planner_prompt: "src/multi_agent/prompts/sage_planner.txt"

  # Retriever settings
  sage_retriever_prompt: "src/multi_agent/prompts/sage_retriever.txt"
  sage_retriever_max_loops: 3
  sage_max_concurrent: 5
  sage_adaptive_dependency_loops: true

  # Verifier settings
  sage_verifier_prompt: "src/multi_agent/prompts/sage_verifier.txt"
  sage_max_verification_rounds: 2
  sage_fail_open_on_verifier_error: false

  # Synthesis settings
  sage_synth_prompt: "src/multi_agent/prompts/sage_synth.txt"

  # Recall / extraction controls
  sage_dual_retrieval_on_low_evidence: false
  sage_low_evidence_threshold: 2
  sage_dual_retrieval_top_k: 4
  sage_extract_evidence: false
  sage_extract_prompt: "src/multi_agent/m5/prompts/extract_evidence.txt"
  sage_extract_max_bullets: 3

  # Adaptive second pass
  sage_retry_pass_enabled: false
  sage_retry_trigger_policy: "default_musique_v1"
  sage_retry_max_passes: 2
  sage_retry_extra_loops: 1
  sage_retry_verification_rounds: 2

  # Shared settings
  max_token_budget: 64000
  verbose: false
