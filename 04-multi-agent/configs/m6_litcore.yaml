llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 4096

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/04-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/04-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/04-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_m6_litcore: true

  m6_manager_prompt: "src/multi_agent/prompts/m6_manager.txt"
  m6_extract_prompt: "src/multi_agent/prompts/m6_extract_claims.txt"
  m6_merge_prompt: "src/multi_agent/prompts/m6_merge_claims.txt"
  m6_answer_prompt: "src/multi_agent/prompts/m6_answer.txt"
  m6_search_prompt: "src/multi_agent/prompts/search_agent.txt"

  m6_max_manager_steps: 12
  m6_max_worker_tasks: 6
  m6_max_claims_to_merge: 3
  m6_worker_max_loops: 4

  sage_extract_evidence: true
  sage_extract_max_bullets: 3
  max_token_budget: 32768
  verbose: false
