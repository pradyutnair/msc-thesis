# M4v3: OSPREY — Evidence-Guided Multi-Agent RAG (no fast-exit gate)
#
# Core mechanism: Phase 1 Scout always runs → evidence guides Phase 2.
# The confidence gate is DISABLED (threshold > 1.0 → never fires).
# ALL questions go through full OSPREY pipeline:
#
#   Phase 1 — Scout: 3-loop broad evidence discovery
#   Phase 2 — Evidence-Aware Decomposition: uses Phase 1 chunks to generate
#              sub-questions targeting ONLY what's missing
#   Phase 3 — Gap-Filling Agents: receive Phase 1 chunks as global chain
#              evidence + CEP from prior waves (bridge questions)
#   Phase 4 — Anchored Synthesis: aggregator uses Phase 1 chunks as prefix
#
# Why no fast-exit?
#   The confidence gate cannot reliably distinguish "confident correct short
#   answer" from "confident-sounding wrong guess" based on text alone.
#   Evidence-guided decomposition is the true value of OSPREY.
#
# Cost vs M3-CEP:
#   +3 scout loops per question (cheap, no retrieval overhead over Phase 2)
#   Wall-clock similar due to parallelism; token overhead ~15-20%
#
# Expected gains:
#   HotpotQA: 67-70% (scout evidence collapses bridge pre-decomposition)
#   2WikiMH:  50-56% (critical: scout identifies intermediate entity)
#   MuSiQue:  37-43% (4-hop benefit from evidence-guided multi-step)

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 512
  chat_template_kwargs:
    enable_thinking: false

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_decomposer: true
  enable_doc_cache: false
  enable_self_verify: false
  enable_cep: true          # CEP still active for bridge questions
  enable_osprey: true       # Activate OSPREY 4-phase pipeline

  # Scout settings
  scout_max_loops: 3
  scout_confidence_threshold: 1.1   # > 1.0 → fast-exit DISABLED
  scout_prompt: "src/multi_agent/prompts/scout.txt"
  scout_max_chunks_evidence: 5
  scout_max_chars_per_chunk: 700

  # Evidence-aware decomposer
  osprey_decomposer_prompt: "src/multi_agent/prompts/decomposer_osprey.txt"

  # Phase 2 gap-filling agents
  max_loops_per_agent: 7
  max_token_budget: 64000
  max_concurrent: 3
  verbose: false
