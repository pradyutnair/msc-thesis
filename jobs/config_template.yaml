# Configuration Template for Multi-Agentic RAG Experiments
# Copy this file and modify for your experiments

experiment:
  name: "baseline_hotpotqa"
  description: "Baseline RAG evaluation on HotpotQA"
  output_dir: "/projects/prjs1800/results/baseline_hotpotqa"

dataset:
  name: "hotpotqa"
  path: "/projects/prjs1800/datasets/hotpotqa/hotpot_dev_distractor_v1.json"
  split: "dev"
  max_examples: 100  # Set to -1 for full dataset
  use_small: true    # Use small split for testing

model:
  llm:
    provider: "openai"
    model_name: "gpt-3.5-turbo"
    temperature: 0.7
    max_tokens: 512
  
  embedding:
    model_name: "all-MiniLM-L6-v2"
    device: "cuda"

retrieval:
  method: "vector"  # Options: vector, graph, hybrid
  top_k: 5
  similarity_threshold: 0.5
  
  vector:
    index_type: "faiss"  # Options: faiss, chromadb
    metric: "cosine"
  
  graph:
    database: "neo4j"
    max_hops: 2

orchestration:
  strategy: "hierarchical"  # Options: hierarchical, collaborative, sequential, adaptive
  
  agents:
    decomposition:
      enabled: true
      max_sub_queries: 3
    
    retrieval:
      num_agents: 1
      parallel: false
    
    synthesis:
      enabled: true
      conflict_resolution: "voting"  # Options: voting, expert, llm

memory:
  enabled: true
  working_memory_size: 10
  short_term_memory_size: 100
  long_term_memory_path: "~/memory/long_term.json"
  consolidation_interval: 100  # Consolidate every N queries

evaluation:
  metrics:
    - "exact_match"
    - "f1_score"
    - "rouge"
    - "bertscore"
  
  save_predictions: true
  save_intermediate: true

logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  save_to_file: true
  log_dir: "~/logs"

resources:
  batch_size: 1
  num_workers: 4
  gpu_memory_limit: "40GB"
