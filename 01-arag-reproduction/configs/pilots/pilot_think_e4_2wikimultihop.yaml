# E4 + Thinking mode: Qwen3-30B-A3B with enable_thinking=true

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 16384
  chat_template_kwargs:
    enable_thinking: true

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"
  batch_size: 16

agent:
  max_loops: 15
  max_token_budget: 128000
  verbose: false

data:
  chunks_file: "/projects/prjs1800/external/arag/data/2wikimultihop/chunks.json"
  questions_file: "/projects/prjs1800/external/arag/data/2wikimultihop/questions.json"
  index_dir: "/projects/prjs1800/external/arag/data/2wikimultihop/index_e5_base_v2"

output:
  results_dir: "/projects/prjs1800/msc-thesis/01-arag-reproduction/results/pilot3_think_fixed/2wikimultihop"
