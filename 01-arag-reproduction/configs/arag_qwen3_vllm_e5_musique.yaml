# A-RAG config for MuSiQue using local vLLM (Qwen3-8B) and E5 retrieval.
#
# Primary refs:
# - A-RAG example config: /projects/prjs1800/external/arag/configs/example.yaml
# - vLLM OpenAI server docs: https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html

llm:
  # This must match --served-model-name in scripts/01_start_vllm_qwen3_8b.sh
  model: "Qwen3-8B"
  # vLLM accepts any non-empty key when auth is not enabled.
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 16384

embedding:
  # Keep E5 to stay aligned with baseline retrieval setup.
  model: "intfloat/e5-base-v2"
  # Query embedding on CPU avoids GPU contention with the generator.
  device: "cpu"
  batch_size: 16

agent:
  max_loops: 15
  max_token_budget: 128000
  verbose: false

data:
  # Using rag_test MuSiQue corpus + the E5 index you already built.
  chunks_file: "/projects/prjs1800/external/arag/data/musique/chunks.json"
  questions_file: "/projects/prjs1800/external/arag/data/musique/questions.json"
  index_dir: "/projects/prjs1800/external/arag/data/musique/index_e5_base_v2"

output:
  results_dir: "/projects/prjs1800/msc-thesis/01-arag-reproduction/results/qwen3-8b-vllm/musique"
