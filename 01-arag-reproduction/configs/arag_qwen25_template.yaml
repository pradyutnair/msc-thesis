# A-RAG config template for local vLLM backend
# Docs: external/arag/configs/example.yaml

llm:
  model: "Qwen2.5-7B-Instruct"
  api_key: "dummy"  # vLLM OpenAI server accepts any non-empty key
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 1024

embedding:
  model: "intfloat/e5-base-v2"
  device: "cuda:0"
  batch_size: 16

agent:
  max_loops: 10
  max_token_budget: 128000
  verbose: false

data:
  corpus_jsonl: "/projects/prjs1800/datasets/flashrag/retrieval-corpus/wiki18_100w.jsonl"
  id_offset_json: "/projects/prjs1800/msc-thesis/01-arag-reproduction/data/index/wiki18_id_offset.json"
  sqlite_db: "/projects/prjs1800/msc-thesis/01-arag-reproduction/data/index/wiki18_fts.db"
  faiss_index_path: "/projects/prjs1800/datasets/flashrag/indexes/e5_Flat.index"
  embedding_model: "intfloat/e5-base-v2"
  embedding_device: "cuda:0"

output:
  results_dir: "/projects/prjs1800/results/arag-expA"