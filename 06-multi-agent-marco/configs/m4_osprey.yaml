# M4: OSPREY — Observe-Scout, Plan, Retrieve, Evidence-Yield
#
# Novel 4-phase architecture:
#   Phase 1 — Scout: single agent, 3 loops, full question, no decomposition
#   Phase 2 — Confidence Gate: fast-exit if scout is confident (easy questions)
#   Phase 3 — Evidence-Aware Decomposition: decomposer sees Phase 1 chunks,
#              generates sub-questions for what's STILL MISSING
#   Phase 4 — Gap-Filling Agents: Phase 2 agents receive Phase 1 chunks as
#              global chain evidence; CEP enabled on top for bridge questions
#   Phase 5 — Anchored Synthesis: aggregator prepends Scout chunks to pool
#
# Efficiency story:
#   - Easy questions (~40%): Scout exits directly → 3× cheaper than E4
#   - Hard questions: scout evidence guides better decomp + retrieval
#
# Expected gains over M3-CEP:
#   HotpotQA: 70-73% (vs 63.4%)
#   2WikiMH:  52-60% (vs 35.4%)
#   MuSiQue:  40-46% (vs 28.7%)

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 512
  chat_template_kwargs:
    enable_thinking: false

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_decomposer: true
  enable_doc_cache: false
  enable_self_verify: false
  enable_cep: true          # CEP still active on top of global scout evidence
  enable_osprey: true       # Activate OSPREY 4-phase pipeline

  # Scout settings
  scout_max_loops: 3
  scout_confidence_threshold: 0.65
  scout_prompt: "src/multi_agent/prompts/scout.txt"
  scout_max_chunks_evidence: 5
  scout_max_chars_per_chunk: 700

  # Evidence-aware decomposer
  osprey_decomposer_prompt: "src/multi_agent/prompts/decomposer_osprey.txt"

  # Phase 2 agents
  max_loops_per_agent: 7
  max_token_budget: 64000
  max_concurrent: 3
  verbose: false
