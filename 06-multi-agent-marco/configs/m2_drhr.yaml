# M2: DRHR — Decomposed Retrieval, Holistic Reasoning.
#
# Key architectural change from M1:
#   - Search agents are pure RETRIEVAL WORKERS (finish() is a stop signal only)
#   - Aggregator IGNORES agent sub-answers entirely
#   - Single holistic synthesis call over the full structured evidence pool
#   - No self-verify (removed to reduce noise)
#   - Evidence budget increased to 8k tokens (no sub-answer overhead)
#
# Pool structure:
#   - comparison: per-entity labeled sections (4k tokens/entity)
#   - bridge:     flat pool ordered by chain step (8k total)
#   - single_hop: direct agent answer bypass

llm:
  model: "Qwen3-30B-A3B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 512
  chat_template_kwargs:
    enable_thinking: false

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

data:
  chunks_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/chunks.json"
  questions_file: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/questions.json"
  index_dir: "/projects/prjs1800/msc-thesis/02-arag-multi-agent/data/hotpotqa/index_e5_base_v2"

multi_agent:
  enable_decomposer: true
  enable_doc_cache: false
  enable_self_verify: false
  max_loops_per_agent: 7
  max_token_budget: 64000
  max_concurrent: 3
  verbose: false
