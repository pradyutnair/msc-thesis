# M6 Ablation: No Critic agent.
# Retrievers auto-verify their own evidence.

llm:
  model: "Qwen3-8B"
  api_key: "dummy"
  base_url: "http://127.0.0.1:8000/v1"
  temperature: 0.0
  max_tokens: 8192

embedding:
  model: "intfloat/e5-base-v2"
  device: "cpu"

m6:
  num_retrievers: 2
  retriever_max_loops: 5
  retriever_max_budget: 32000
  max_ticks: 20
  token_budget: 200000
  wall_clock_timeout: 600.0
  enable_critic: false
  enable_backtracking: false
  enable_consistency_check: false
